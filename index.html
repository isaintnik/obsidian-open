<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Obsidian</title>
<style>
:root{color-scheme:light dark}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:32rem;margin:18vh auto 0;padding:0 16px;text-align:center}
a.btn{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:8px;border:1px solid currentColor;text-decoration:none;color:inherit}
p.note{opacity:.7;font-size:14px;word-break:break-all}
</style>
</head>
<body>
<p id="msg">Opening note in Obsidian…</p>
<a class="btn" id="go" hidden>Open in Obsidian</a>
<p class="note" id="name"></p>
<script>
// https -> obsidian://open redirect. Vault and note path live in the URL fragment (#vault=…&file=…),
// which browsers never send to the server. Only obsidian://open is ever built: no open redirect.
(function () {
  var p = new URLSearchParams(location.hash.replace(/^#/, ""));
  var vault = p.get("vault"), file = p.get("file");
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!vault || !file) { msg.textContent = "No note in this link. Expected #vault=…&file=…"; return; }
  var uri = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file);
  document.getElementById("name").textContent = file;
  go.href = uri; go.hidden = false;
  location.href = uri;
})();
</script>
</body>
</html>
